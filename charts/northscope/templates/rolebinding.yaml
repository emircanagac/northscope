{{- if and .Values.rbac.create .Values.watchNamespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "northscope.fullname" . }}-read-only
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "northscope.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "northscope.fullname" . }}-read-only
subjects:
  - kind: ServiceAccount
    name: {{ include "northscope.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
