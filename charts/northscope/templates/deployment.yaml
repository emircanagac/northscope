apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "northscope.fullname" . }}
  labels:
    {{- include "northscope.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "northscope.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "northscope.selectorLabels" . | nindent 8 }}
      {{- $authChecksum := "" }}
      {{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
      {{- $authChecksum = include "northscope.authSecretData" . | sha256sum }}
      {{- end }}
      {{- if or .Values.podAnnotations $authChecksum }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $authChecksum }}
        checksum/auth: {{ $authChecksum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "northscope.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: northscope
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-addr=:8080"
            - "-gateway-api={{ .Values.discovery.gatewayAPI.enabled }}"
            - "-f5={{ .Values.discovery.f5.enabled }}"
            {{- if .Values.watchNamespace }}
            - "-namespace={{ .Values.watchNamespace }}"
            {{- end }}
            {{- if .Values.auth.enabled }}
            - "-auth-dir=/etc/northscope/auth"
            - "-auth-cookie-secure={{ .Values.auth.cookieSecure }}"
            - "-auth-protect-metrics={{ .Values.auth.protectMetrics }}"
            {{- end }}
{{ range .Values.extraArgs }}
            - {{ . | quote }}
{{ end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.auth.enabled }}
          volumeMounts:
            - name: auth
              mountPath: /etc/northscope/auth
              readOnly: true
          {{- end }}
      {{- if .Values.auth.enabled }}
      volumes:
        - name: auth
          secret:
            secretName: {{ include "northscope.authSecretName" . }}
            items:
              - key: username
                path: username
              - key: password
                path: password
              - key: session-key
                path: session-key
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
