{{- include "northscope.validateAuth" . -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "northscope.authSecretName" . }}
  labels:
    {{- include "northscope.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "northscope.authSecretData" . | nindent 2 }}
{{- end }}
